name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright e2e (pinned Chromium, official Playwright image)
    needs: build-and-test
    runs-on: ubuntu-latest
    # The official image ships the exact Playwright/Chromium build pinned in
    # package.json (see docs note below and playwright.config.ts), so the
    # container's browser reproduces this repo's committed screenshot
    # baselines instead of whatever Chromium `--with-deps` would resolve on
    # a bare runner. --ipc=host follows Playwright's own Docker guidance to
    # avoid Chromium running out of shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-node here: the container's own Node/npm (newer than
      # this repo's baseline dev environment) is intentional, and npm ci
      # against the committed lockfile is verified to work with it.
      - run: npm ci

      - name: Playwright e2e (workers capped, see playwright.config.ts)
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (screenshot diffs, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
